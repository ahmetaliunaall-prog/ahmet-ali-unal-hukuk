/* =========================================================
   BOMBastic PREMIUM EDITORIAL DESIGN — DEFAULT, ZERO-CONFIG
   The public site is intentionally opinionated: the visitor sees
   a finished visual system without needing any admin tuning.
========================================================= */
:root{
  --bg:#070b12;--panel:#0c131f;--panel2:#101a29;--line:rgba(216,195,151,.16);

  --shadow:0 28px 80px rgba(0,0,0,.34);--radius:18px;--max:1280px
}
html{background:#070b12}body{
  font-family:var(--sans);font-size:15px;letter-spacing:-.01em;
  background:
    radial-gradient(900px 480px at 88% -12%,rgba(199,165,104,.13),transparent 62%),
    radial-gradient(760px 520px at -10% 34%,rgba(38,62,93,.12),transparent 66%),
    linear-gradient(180deg,#070b12 0%,#080d15 52%,#060a10 100%);
  overflow-x:hidden
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to bottom,black,transparent 72%)}
.container{width:min(calc(100% - 44px),var(--max))}
.site-header{background:rgba(7,11,18,.76);backdrop-filter:blur(22px) saturate(135%);border-bottom:1px solid rgba(255,255,255,.055);box-shadow:0 10px 40px rgba(0,0,0,.12)}

.nav-cta{border-radius:999px!important;padding:10px 15px!important;background:rgba(199,165,104,.09)!important;border:1px solid rgba(199,165,104,.35)!important;color:var(--gold2)!important}.nav-cta:hover{background:rgba(199,165,104,.16)!important}
.site-announcement{background:linear-gradient(90deg,rgba(199,165,104,.12),rgba(255,255,255,.025),rgba(199,165,104,.08));border-bottom:1px solid rgba(199,165,104,.13);font-size:11px;letter-spacing:.02em}.announcement-inner{min-height:38px;display:flex;justify-content:center;align-items:center;gap:14px}.announcement-inner a{color:var(--gold2);font-weight:700}
.hero{position:relative;padding:122px 0 106px}.hero:before{content:"";position:absolute;left:-18vw;top:30px;width:55vw;height:1px;background:linear-gradient(90deg,transparent,rgba(199,165,104,.38),transparent)}.hero-grid{grid-template-columns:minmax(0,1.18fr) minmax(360px,.82fr);gap:76px}.hero h1{font-size:clamp(58px,8vw,108px);letter-spacing:-.055em;max-width:950px}.hero p{font-size:18px;line-height:1.8;color:#aeb8c5;max-width:700px}.hero .eyebrow{display:flex;align-items:center;gap:12px}.hero .eyebrow:before{content:"";width:34px;height:1px;background:var(--gold)}
.actions{gap:12px}.btn{border-radius:999px;padding:12px 18px;background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.11);transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease}.btn:hover{transform:translateY(-2px);border-color:rgba(199,165,104,.45);box-shadow:0 12px 28px rgba(0,0,0,.2)}.btn.primary{box-shadow:0 10px 28px rgba(199,165,104,.13);background:linear-gradient(135deg,#c7a568,#dfc487);border-color:#c7a568}.btn.primary:hover{background:linear-gradient(135deg,#dfc487,#efd79f)}

.grid{gap:18px}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{position:relative;border-radius:20px;padding:25px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.075);box-shadow:0 14px 44px rgba(0,0,0,.13);overflow:hidden;transition:transform .28s cubic-bezier(.2,.7,.2,1),border-color .28s ease,box-shadow .28s ease}.card:before{content:"";position:absolute;left:0;top:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(199,165,104,.42),transparent);opacity:0;transition:opacity .28s}.card:hover{transform:translateY(-5px);border-color:rgba(199,165,104,.24);box-shadow:0 22px 60px rgba(0,0,0,.22)}.card:hover:before{opacity:1}.card h3{letter-spacing:-.025em}.article-content{font-size:17px;line-height:1.9;color:#dfe5ec}.article-content h2,.article-content h3,.article-content h4{font-family:var(--serif);letter-spacing:-.02em}.article-content blockquote{border-left:2px solid var(--gold);margin:24px 0;padding:10px 22px;color:#c8d0db;font-family:var(--serif);font-size:24px}
/* distinct editorial cards without configuration */
.grid-3>.card:nth-child(3n+1){border-radius:20px 8px 20px 20px}.grid-3>.card:nth-child(3n+2){border-radius:8px 20px 20px 20px}.grid-3>.card:nth-child(3n){border-radius:20px}.grid-3>.card:nth-child(3n+1):after{content:"01";position:absolute;right:18px;top:14px;color:rgba(199,165,104,.25);font:600 13px var(--sans)}.grid-3>.card:nth-child(3n+2):after{content:"02";position:absolute;right:18px;top:14px;color:rgba(199,165,104,.25);font:600 13px var(--sans)}.grid-3>.card:nth-child(3n):after{content:"03";position:absolute;right:18px;top:14px;color:rgba(199,165,104,.25);font:600 13px var(--sans)}
.meta{letter-spacing:.08em;text-transform:uppercase;font-size:10px}.tag{border:1px solid rgba(199,165,104,.14);background:rgba(199,165,104,.07);padding:5px 9px}
.searchbar{padding:8px;border:1px solid rgba(255,255,255,.07);border-radius:16px;background:rgba(255,255,255,.025);max-width:780px}.field input,.field textarea,.field select,.searchbar input{background:rgba(4,8,14,.58);border-color:rgba(255,255,255,.08);border-radius:12px;padding:13px 14px}.field input:focus,.field textarea:focus,.field select:focus,.searchbar input:focus{border-color:rgba(199,165,104,.62);box-shadow:0 0 0 4px rgba(199,165,104,.07)}
.accordion{border-radius:16px;border-color:rgba(255,255,255,.075);background:rgba(255,255,255,.018);margin:10px 0}.accordion button{background:transparent;padding:20px 22px;font-size:15px}.accordion .answer{padding:0 22px 22px;line-height:1.8}
.contact-cta{padding:34px 36px;border-radius:24px;background:linear-gradient(115deg,rgba(199,165,104,.10),rgba(255,255,255,.025));border-color:rgba(199,165,104,.18);display:flex;justify-content:space-between;gap:24px;align-items:center}
.footer{position:relative;margin-top:30px;padding:78px 0 26px;background:linear-gradient(180deg,rgba(255,255,255,.012),rgba(255,255,255,.025));border-top:1px solid rgba(199,165,104,.14)}.footer:before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(199,165,104,.65) 50%,transparent 95%)}.footer-grid-premium{grid-template-columns:1.35fr .8fr .9fr .95fr;gap:44px}.footer .brand-title{font-size:32px}.footer p{line-height:1.8;color:#8995a6;font-size:13px}.footer h3{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold2);margin:0 0 16px}.footer-link-list{display:grid;gap:9px}.footer-link-list a{font-size:13px;color:#aab3c0;transition:.18s}.footer-link-list a:hover{color:#fff;transform:translateX(3px)}.footer-socials{gap:7px}.footer-social{border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.025);padding:7px 10px}.footer-social:hover{border-color:rgba(199,165,104,.4);color:var(--gold2)}.footer-cta{margin-top:8px}.footer-bottom{display:flex;justify-content:space-between;gap:20px;border-top:1px solid rgba(255,255,255,.07);margin-top:54px;padding-top:18px;color:#697586;font-size:10px;letter-spacing:.04em}
/* public page rhythm */
.section:nth-of-type(even) .section-head h2{max-width:780px}.section .empty{background:rgba(255,255,255,.018);border-color:rgba(199,165,104,.13);padding:60px 25px}.detail{max-width:920px}.detail>article{padding-top:15px}.detail .article-content{font-size:18px}.reading-progress{height:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 12px rgba(199,165,104,.4)}
/* admin gets the same design language, but remains operational */

const PUBLIC_CACHE_KEY='hukuk-portal-public-v5';
const PUBLIC_CACHE_TTL=1000*60*60*24*3;
let DATA_DEGRADED=false;
function cachePublic(){try{localStorage.setItem(PUBLIC_CACHE_KEY,JSON.stringify({at:Date.now(),settings:STATE.siteSettings,navigation:STATE.navigation,home:STATE.homepageSections,articles:STATE.articles,caselaw:STATE.caselaw,glossary:STATE.glossary,faq:STATE.faq}));}catch(e){console.warn('Cache write failed',e);}}
function restorePublicCache(){try{const raw=localStorage.getItem(PUBLIC_CACHE_KEY);if(!raw)return false;const x=JSON.parse(raw);if(!x||Date.now()-Number(x.at)>PUBLIC_CACHE_TTL)return false;if(x.settings)STATE.siteSettings=x.settings;if(Array.isArray(x.navigation))STATE.navigation=x.navigation.filter(n=>n&&n.is_visible!==false);if(Array.isArray(x.home))STATE.homepageSections=x.home.filter(n=>n&&n.is_visible!==false);if(Array.isArray(x.articles))STATE.articles=x.articles;if(Array.isArray(x.caselaw))STATE.caselaw=x.caselaw;if(Array.isArray(x.glossary))STATE.glossary=x.glossary;if(Array.isArray(x.faq))STATE.faq=x.faq;DATA_DEGRADED=true;return true;}catch{return false;}}

async function query(table, options={}){
  let lastError=null;
  for(let attempt=0;attempt<3;attempt++){
    try{
      STATE.diagnostics.requests++;
      let q=sb.from(table).select(options.select || '*');
      if(options.filters) for(const f of options.filters) q=f(q);
      if(options.order) q=q.order(options.order.column,{ascending:options.order.ascending!==false});
      if(options.limit) q=q.limit(options.limit);
      const {data,error}=await withTimeout(q,12000);
      if(error) throw error;
      return {data:data || [],error:null};
    }catch(error){lastError=error;STATE.diagnostics.failures++;STATE.diagnostics.lastError=error?.message||String(error);if(attempt<2)await sleep(250*(attempt+1));}
  }
  console.error(`Supabase query failed: ${table}`,lastError); return {data:[],error:lastError};
}

}

async function loadPublicContent(){

async function refreshAuth(){
  const {data,error}=await sb.auth.getSession();
  if(error) console.error('Session error',error);
  STATE.session=data?.session || null;
  STATE.user=STATE.session?.user || null;
  STATE.isAdmin=false;
  if(STATE.user){
    const {data:adminRows,error:adminError}=await sb.from(CONFIG.TABLES.adminUsers).select('user_id').eq('user_id',STATE.user.id).limit(1);
    if(adminError) console.error('Admin check failed',adminError);
    STATE.isAdmin=!adminError && !!adminRows?.length;
  }
}
async function login(email,password){
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error) throw error;
  STATE.session=data.session; STATE.user=data.user;
  await refreshAuth();
  if(!STATE.isAdmin){ await sb.auth.signOut(); STATE.session=null; STATE.user=null; throw new Error('Bu hesap yönetici değil.'); }
  await loadAdminContent();
  location.hash='#admin';
}
async function logout(){
  const {error}=await sb.auth.signOut();
  if(error) console.error('Logout error',error);
  STATE.session=null; STATE.user=null; STATE.isAdmin=false;
  STATE.articles=[];STATE.caselaw=[];STATE.glossary=[];STATE.faq=[];STATE.messages=[];STATE.visitors=[];
  await loadPublicContent();
  location.hash='#home';
  render();
  notify('Çıkış yapıldı.','ok');
}

function siteBaseUrl(){
  const configured=safeUrl(currentSettings().site_url);
  if(configured) return configured.replace(/#.*$/,'').replace(/\/$/,'');
  return location.origin;
}
function pageCanonical(){const base=siteBaseUrl();const r=routePath();return r==='home'?base:(base.replace(/\/$/,'')+'/'+r.replace(/^\/+/,''));}
function setMeta({title,description,type='website',jsonLd=null,noindex=false,image=''}){
  const s=currentSettings();
  const finalTitle=title ? `${title} | ${siteName()}` : (s.seo_title || siteName());
  const desc=text(description || s.seo_description || s.home_description || '').replace(/\s+/g,' ').trim().slice(0,300);
  document.title=finalTitle;
  let themeMeta=document.querySelector('meta[name="theme-color"]');if(!themeMeta){themeMeta=document.createElement('meta');themeMeta.name='theme-color';document.head.appendChild(themeMeta)}themeMeta.content=document.body.classList.contains('user-light')?'#f4f0e8':'#070b12';
  const setName=(name,val)=>{let e=document.querySelector(`meta[name="${name}"]`);if(!e){e=document.createElement('meta');e.name=name;document.head.appendChild(e)}e.content=val||''};
  const setProp=(name,val)=>{let e=document.querySelector(`meta[property="${name}"]`);if(!e){e=document.createElement('meta');e.setAttribute('property',name);document.head.appendChild(e)}e.content=val||''};
  setName('description',desc);setName('robots',noindex?'noindex,nofollow':'index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1');
  setProp('og:type',type);setProp('og:title',finalTitle);setProp('og:description',desc);setProp('og:url',pageCanonical());setProp('og:site_name',siteName());setProp('og:locale','tr_TR');
  setName('twitter:title',finalTitle);setName('twitter:description',desc);if(image)setProp('og:image',safeUrl(image));
  let canon=document.querySelector('link[rel="canonical"]');if(!canon){canon=document.createElement('link');canon.rel='canonical';document.head.appendChild(canon)}
  /* Hash URLs are not ideal SEO URLs; canonical is kept deterministic and based on the configured domain. */
  canon.href=pageCanonical();
  document.querySelectorAll('script[data-portal-jsonld]').forEach(x=>x.remove());
  if(jsonLd){
    const el=document.createElement('script');
    el.type='application/ld+json';
    el.dataset.portalJsonld='1';
    /* Cloudflare injects a CSP nonce into executable scripts. Reuse it for runtime JSON-LD. */
    const nonceSource=document.querySelector('script[nonce]');
    if(nonceSource?.nonce) el.setAttribute('nonce',nonceSource.nonce);
    el.textContent=JSON.stringify(jsonLd);
    document.head.appendChild(el);
  }
}

function baseJsonLd(){const s=currentSettings();return {'@context':'https://schema.org','@graph':[{'@type':'WebSite','@id':siteBaseUrl()+'#website',name:siteName(),url:siteBaseUrl(),inLanguage:'tr-TR',publisher:{'@id':siteBaseUrl()+'#person'}},personJsonLd()]};}
function breadcrumbJsonLd(items){return {'@type':'BreadcrumbList','itemListElement':items.map((x,i)=>({'@type':'ListItem',position:i+1,name:x.name,item:x.url||undefined}))};}

 ['SEO title',!!(s.seo_title||s.home_title||siteName()),'Genel başlık mevcut'],

 ];return {checks,score:Math.round(checks.filter(x=>x[1]).length/checks.length*100)};}

function featureGroup(key){if(key.startsWith('page_'))return 'Sayfalar';if(key.includes('_home')||['hero','about','principles','contact_home'].includes(key))return 'Ana sayfa';if(['header','header_search','header_theme','header_menu','header_cta','announcement','footer'].includes(key))return 'Site kabuğu';return 'Deneyim araçları';}

function sectionAttrs(key,base){const x=rawSection(key)||{};const z=x.settings||{};return `class="${base} variant-${esc(z.variant||'default')} ${esc(z.className||'')}"`; }
async function ensureChromeSection(){if(!STATE.isAdmin)return;const exists=STATE.homepageSections.find(x=>x.section_key==='site_chrome');if(exists)return;const {data,error}=await sb.from(CONFIG.TABLES.home).insert({section_key:'site_chrome',title:'Site Arayüzü',is_visible:true,sort_order:999,settings:{header_visible:true,footer_visible:true,nav_aria:'Ana menü',brand:{},footer:{}}}).select().single();if(!error&&data)STATE.homepageSections.push(data);}
function pageChrome(page,key,defaults={}){const pages=chromeSettings().pages||{};return {...defaults,...(pages[page]||{})};}
function customSection(x){const z=x.settings||{};const eyebrow=z.eyebrow||x.title||'Bölüm';const title=z.heading||x.title||'Yeni bölüm';const content=z.content!==undefined?z.content:(x.content||'');const button=z.button||{};const image=safeUrl(z.image_url||'');return `<section ${sectionAttrs(x.section_key,'section custom-section')}><div class="container"><div class="section-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(title)}</h2>${x.subtitle?`<p class="section-intro">${esc(x.subtitle)}</p>`:''}</div>${button.visible!==false&&button.label?`<a class="btn ${button.primary!==false?'primary':''}" href="${esc(safeHref(button.route,'#home'))}">${esc(button.label)}</a>`:''}</div><div class="custom-content ${image?'with-image':''}">${image?`<img src="${esc(image)}" alt="${esc(z.image_alt||title)}">`:''}<div class="card article-content">${sanitizeContent(content)}</div></div></div></section>`;}
function renderHomeSection(x){

  if(featureForSection&&!featureEnabled(featureForSection))return '';
  const s=currentSettings();
  if(key==='hero'){
    const heroTitle=z.heading||s.home_title||x.title||'Hukuku daha anlaşılır kılmak.';
    const heroSub=z.description||s.home_description||x.subtitle||'Güncel hukuk bilgileri, içtihatlar ve güvenilir bir bilgi bankası.';
    const b1=z.button1||{label:'Makaleleri keşfet',route:'#makaleler',primary:true}; const b2=z.button2||{label:'İçtihatlara bak',route:'#ictihatlar',primary:false};
    const heroImage=safeUrl(z.image_url||'');
    return `<section ${sectionAttrs(key,'hero')}><div class="container hero-grid"><div><div class="eyebrow">${esc(z.eyebrow||s.slogan||'HUKUK • İÇTİHAT • BİLGİ')}</div><h1>${esc(heroTitle)}</h1><p>${esc(heroSub)}</p><div class="actions">${b1.visible!==false&&b1.label?`<a class="btn ${b1.primary!==false?'primary':'ghost'}" href="${esc(safeHref(b1.route,'#makaleler'))}">${esc(b1.label)}</a>`:''}${b2.visible!==false&&b2.label?`<a class="btn ${b2.primary===true?'primary':'ghost'}" href="${esc(safeHref(b2.route,'#ictihatlar'))}">${esc(b2.label)}</a>`:''}</div></div><div class="hero-card">${heroImage?`<img class="hero-image" src="${esc(heroImage)}" alt="${esc(z.image_alt||s.author_name||siteName())}">`:`<div class="seal">${esc(z.mark||'§')}</div>`}<div class="eyebrow">${esc(z.card_eyebrow||s.author_name||'Ahmet Ali Ünal')}</div><h3 class="serif" style="font-size:32px;margin:8px 0">${esc(z.card_title||s.profession||'Stajyer Avukat')}</h3><p>${esc(z.card_text||s.city||'')}</p></div></div></section>`;
  }
  if(key==='about'){
    const content=x.content||ABOUT_DEFAULT; return `<section ${sectionAttrs(key,'section alt')}><div class="container"><div class="section-head"><div><div class="eyebrow">${esc(z.eyebrow||'Hakkımda')}</div><h2>${esc(z.heading||x.title||'Ahmet Ali Ünal')}</h2><p class="section-intro">${esc(z.description||x.subtitle||'Hukuka yaklaşım, akademik yolculuk ve bu platformun amacı.')}</p></div>${z.button_visible!==false?`<a class="btn" href="${esc(safeHref(z.button_route,'#hakkimda'))}">${esc(z.button_label||'Detaylı biyografi')}</a>`:''}</div><div class="card about-card"><div class="article-content">${sanitizeContent(content)}</div></div></div></section>`;
  }
  if(key==='principles'){
    const values=(x.content||'Muhakeme\nMetodoloji\nAçıklık').split(/\n+/).filter(Boolean); const desc=z.card_description||'Somut olayın kendine özgü yapısını merkeze alan düzenli ve analitik çalışma.';
    return `<section ${sectionAttrs(key,'section')}><div class="container"><div class="section-head"><div><div class="eyebrow">${esc(z.eyebrow||'Yaklaşım')}</div><h2>${esc(z.heading||x.title||'Çalışma ilkeleri')}</h2><p class="section-intro">${esc(z.description||x.subtitle||'')}</p></div></div><div class="grid grid-3">${values.map((v,i)=>`<div class="card principle-card"><div class="eyebrow">${String(i+1).padStart(2,'0')}</div><h3>${esc(v)}</h3><p>${esc(desc)}</p></div>`).join('')}</div></div></section>`;
  }
  if(key==='articles'){
    const items=STATE.articles.slice(0,Number(z.limit||3)); return `<section ${sectionAttrs(key,'section alt')}><div class="container"><div class="section-head"><div><div class="eyebrow">${esc(z.eyebrow||'Yayınlar')}</div><h2>${esc(z.heading||'Makaleler')}</h2></div>${z.button_visible!==false?`<a class="btn" href="${esc(safeHref(z.button_route,'#makaleler'))}">${esc(z.button_label||'Tümünü gör')}</a>`:''}</div><div class="grid grid-3">${items.length?items.map(articleCard).join(''):`<div class="empty" style="grid-column:1/-1">${esc(z.empty_text||'Henüz yayınlanmış makale bulunmuyor.')}</div>`}</div></div></section>`;
  }
  if(key==='caselaw'){
    const items=STATE.caselaw.slice(0,Number(z.limit||3)); return `<section ${sectionAttrs(key,'section')}><div class="container"><div class="section-head"><div><div class="eyebrow">${esc(z.eyebrow||'Kararlar')}</div><h2>${esc(z.heading||'İçtihatlar')}</h2></div>${z.button_visible!==false?`<a class="btn" href="${esc(safeHref(z.button_route,'#ictihatlar'))}">${esc(z.button_label||'Tümünü gör')}</a>`:''}</div><div class="grid grid-3">${items.length?items.map(caseCard).join(''):`<div class="empty" style="grid-column:1/-1">${esc(z.empty_text||'Henüz yayınlanmış içtihat bulunmuyor.')}</div>`}</div></div></section>`;
  }
  if(key==='glossary'){
    const items=STATE.glossary.slice(0,Number(z.limit||6)); return `<section ${sectionAttrs(key,'section alt')}><div class="container"><div class="section-head"><div><div class="eyebrow">${esc(z.eyebrow||'Bilgi Bankası')}</div><h2>${esc(z.heading||'Hukuk sözlüğü')}</h2></div>${z.button_visible!==false?`<a class="btn" href="${esc(safeHref(z.button_route,'#sozluk'))}">${esc(z.button_label||'Sözlüğe git')}</a>`:''}</div><div class="grid grid-3">${items.length?items.map(term=>`<a class="card" href="${esc(safeHref("#sozluk/"+encodeURIComponent(term.id),"/sozluk"))}"><h3>${esc(term.term)}</h3><p>${esc(text(term.definition).slice(0,150))}${text(term.definition).length>150?'…':''}</p></a>`).join(''):`<div class="empty" style="grid-column:1/-1">${esc(z.empty_text||'Henüz terim bulunmuyor.')}</div>`}</div></div></section>`;
  }
  if(key==='faq'){
    const items=STATE.faq.slice(0,Number(z.limit||5)); return `<section ${sectionAttrs(key,'section')}><div class="container"><div class="section-head"><div><div class="eyebrow">${esc(z.eyebrow||'Bilgi')}</div><h2>${esc(z.heading||'Sık sorulan sorular')}</h2></div>${z.button_visible!==false?`<a class="btn" href="${esc(safeHref(z.button_route,'#sss'))}">${esc(z.button_label||'Tümünü gör')}</a>`:''}</div>${items.length?items.map(f=>`<div class="accordion"><button data-action="faq-toggle" data-id="${esc(f.id)}">${esc(f.question)}<span>＋</span></button><div class="answer hidden" id="faq-${esc(f.id)}">${sanitizeContent(f.answer)}</div></div>`).join(''):`<div class="empty">${esc(z.empty_text||'Henüz SSS bulunmuyor.')}</div>`}</div></section>`;
  }
  if(key==='contact'){
    return `<section ${sectionAttrs(key,'section alt')}><div class="container"><div class="card contact-cta"><div><div class="eyebrow">${esc(z.eyebrow||'İletişim')}</div><h2 class="serif" style="font-size:40px;margin:5px 0">${esc(z.heading||'Bir sorunuz mu var?')}</h2><p class="muted">${esc(z.description||'Mesajınızı güvenli biçimde iletebilirsiniz.')}</p></div><a class="btn primary" href="${esc(safeHref(z.button_route,'#iletisim'))}">${esc(z.button_label||'İletişime geç')}</a></div></div></section>`;
  }
  return customSection(x);
}
function home(){
  const s=currentSettings();
  const ordered=[...STATE.homepageSections].filter(x=>x.section_key!=='site_chrome').sort((a,b)=>(a.sort_order??0)-(b.sort_order??0));
  setMeta({title:s.home_title||'Ana Sayfa',description:s.home_description||'Hukuk, içtihat ve bilgi portalı.',jsonLd:{'@context':'https://schema.org','@graph':[...baseJsonLd()['@graph'],{'@type':'WebPage','@id':siteBaseUrl()+'#home','url':siteBaseUrl(),'name':s.home_title||siteName(),isPartOf:{'@id':siteBaseUrl()+'#website'}}]}});
  return ordered.filter(x=>x.is_visible!==false).map(renderHomeSection).join('')+renderFooter();
}

function articleCard(a){return `<a class="card" href="${esc(safeHref("#makale/"+encodeURIComponent(a.slug),"/makaleler"))}"><div class="meta">${esc(a.category||'Hukuk')} · ${formatDate(a.published_at||a.updated_at)}</div><h3 class="serif" style="font-size:28px">${esc(a.title)}</h3><p>${esc(a.excerpt || text(a.content).slice(0,130))}${text(a.excerpt||a.content).length>130?'…':''}</p><div>${tagsHtml(a.tags)}</div></a>`;}
function caseCard(c){return `<a class="card" href="${esc(safeHref("#ictihat/"+encodeURIComponent(c.id),"/ictihatlar"))}"><div class="meta">${esc(c.court)}${c.chamber?' · '+esc(c.chamber):''}</div><h3>${esc(c.title || c.decision_number || 'İçtihat')}</h3><p>${esc(c.summary || text(c.content).slice(0,130))}${text(c.summary||c.content).length>130?'…':''}</p><div>${tagsHtml(c.tags)}</div></a>`;}
function listPage(kind){
  const configs={articles:{title:'Makaleler',eyebrow:'Yayınlar',items:STATE.articles,card:articleCard,search:['title','excerpt','content','category']},caselaw:{title:'İçtihatlar',eyebrow:'Kararlar',items:STATE.caselaw,card:caseCard,search:['court','chamber','decision_number','title','summary','content','category']},glossary:{title:'Hukuk Sözlüğü',eyebrow:'Bilgi Bankası',items:STATE.glossary,card:x=>`<a class="card" href="${esc(safeHref("#sozluk/"+encodeURIComponent(x.id),"/sozluk"))}"><div class="meta">${esc(x.category||'Genel')}</div><h3>${esc(x.term)}</h3><p>${esc(x.definition.slice(0,180))}${x.definition.length>180?'…':''}</p></a>`,search:['term','definition','category','related_terms']}};
  const c=configs[kind], q=(STATE.ui.search||'').trim().toLocaleLowerCase('tr-TR');
  const items=c.items.filter(x=>!q || c.search.some(k=>text(x[k]).toLocaleLowerCase('tr-TR').includes(q)));
  const p=pageChrome(kind,kind,{title:c.title,eyebrow:c.eyebrow,description:`${c.title} — ${siteName()}`});
  setMeta({title:p.title,description:p.description});
  return `<section class="section"><div class="container"><div class="section-head"><div><div class="eyebrow">${esc(p.eyebrow)}</div><h2>${esc(p.title)}</h2>${p.description?`<p class="section-intro">${esc(p.description)}</p>`:''}</div></div><div class="searchbar"><input id="listSearch" value="${esc(STATE.ui.search)}" placeholder="${esc(p.search_placeholder||chromeSettings().ui?.search_placeholder||'Ara…')}" aria-label="Ara"><button class="btn" data-action="clear-search">${esc(p.clear_label||chromeSettings().ui?.clear_label||'Temizle')}</button></div><div class="grid grid-3">${items.length?items.map(c.card).join(''):`<div class="empty" style="grid-column:1/-1">${esc(p.empty_text||'Aramanızla eşleşen içerik bulunamadı.')}</div>`}</div></div></section>${renderFooter()}`;
}
function articleDetail(slug){

}

function detailShell(content){return `<section class="section detail-section"><div class="container detail"><button class="btn ghost small" data-action="go-back" type="button">${esc(chromeSettings().ui?.back_label||'← Geri')}</button><div class="reading-toolbar" aria-label="Okuma araçları">${featureEnabled('saved')?'<button class="btn small" data-action="save-current">♡ Kaydet</button>':''}${featureEnabled('share')?'<button class="btn small" data-action="share-current">↗ Paylaş</button>':''}${featureEnabled('citation')?'<button class="btn small" data-action="copy-citation">⧉ Atfı kopyala</button>':''}${featureEnabled('reading_mode')?'<button class="btn small" data-action="reading-mode">◐ Odak modu</button>':''}<button class="btn small" data-action="font-dec">A−</button><button class="btn small" data-action="font-inc">A+</button></div><article class="reading-article" style="margin-top:25px">${content}</article></div></section>${renderFooter()}`;}

function faqPage(){const p=pageChrome('faq','faq',{title:'SSS',eyebrow:'Bilgi',description:'Sık sorulan sorular'});setMeta({title:p.title,description:p.description,jsonLd:{'@context':'https://schema.org','@type':'FAQPage','mainEntity':STATE.faq.map(f=>({'@type':'Question',name:f.question,acceptedAnswer:{'@type':'Answer',text:f.answer}}))}});return `<section class="section"><div class="container"><div class="eyebrow">${esc(p.eyebrow)}</div><h2>${esc(p.title)}</h2>${p.description?`<p class="section-intro">${esc(p.description)}</p>`:''}<div class="searchbar"><input id="faqSearch" placeholder="Sorularda ara…"><button class="btn" data-action="clear-faq-search">Temizle</button></div><div id="faqList">${faqItems(STATE.faq)}</div></div></section>${renderFooter()}`;}

function contentHealth(){
  const articleSlugs=STATE.articles.filter(isPublished).map(x=>text(x.slug).trim()).filter(Boolean);
  const duplicateSlugs=articleSlugs.length-new Set(articleSlugs).size;
  const missingSeo=STATE.articles.filter(isPublished=>false); // keep linter-friendly; real checks below
  const publishedArticles=STATE.articles.filter(isPublished);
  const weakArticles=publishedArticles.filter(x=>wordCount(x.content)<180 || text(x.seo_description||x.excerpt).length<70 || text(x.title).length<8);
  const brokenNav=STATE.navigation.filter(x=>x.is_visible!==false&&!safeHref(x.route,''));
  const emptyGlossary=STATE.glossary.filter(x=>isPublished(x)&&wordCount(x.definition)<20);
  const faqNoAnswer=STATE.faq.filter(x=>isPublished(x)&&wordCount(x.answer)<8);
  const checks=[
    ['Makale SEO alanları',weakArticles.length===0,weakArticles.length?`${weakArticles.length} içerik iyileştirilebilir`:'Tamam'],
    ['Tekil makale slug',duplicateSlugs===0,duplicateSlugs?`${duplicateSlugs} çakışma`:'Tamam'],
    ['Menü hedefleri',brokenNav.length===0,brokenNav.length?`${brokenNav.length} bozuk hedef`:'Tamam'],
    ['Sözlük tanımları',emptyGlossary.length===0,emptyGlossary.length?`${emptyGlossary.length} kısa tanım`:'Tamam'],
    ['SSS cevapları',faqNoAnswer.length===0,faqNoAnswer.length?`${faqNoAnswer.length} kısa cevap`:'Tamam']
  ];
  return {checks,weakArticles,duplicateSlugs,brokenNav,emptyGlossary,faqNoAnswer,score:Math.round(checks.filter(x=>x[1]).length/checks.length*100)};
}

function seoAutopilotReport(){
  const base=siteBaseUrl();
  const published=STATE.articles.filter(isPublished);
  const checks=[
    ['HTTPS',location.protocol==='https:'||location.hostname==='localhost','Canlı yayında HTTPS kullanılmalı'],
    ['Canonical',!!document.querySelector('link[rel="canonical"]') && document.querySelector('link[rel="canonical"]').href.startsWith('http'),'Canonical URL'],
    ['Robots',!!document.querySelector('meta[name="robots"]'),'Robots meta'],
    ['Sitemap',!!base,'Worker /sitemap.xml'],
    ['Structured data',document.querySelectorAll('script[type="application/ld+json"]').length>0,'JSON-LD'],
    ['Open Graph',!!document.querySelector('meta[property="og:title"]')&&!!document.querySelector('meta[property="og:description"]'),'Paylaşım metadata'],
    ['One H1',document.querySelectorAll('h1').length<=1,'Sayfa başına tek ana başlık hedefi'],
    ['Images alt',Array.from(document.images).every(i=>i.alt!==undefined),'Görsel alternatif metinleri'],
    ['Internal links',document.querySelectorAll('a[href^="/"],a[href^="#"]').length>2,'İç bağlantı ağı'],
    ['Published content',published.length>0,'Yayınlanmış içerik mevcut']
  ];
  const missingSeo=published.filter(a=>!text(a.seo_title).trim()||text(a.seo_description||a.excerpt).trim().length<80);
  const thin=published.filter(a=>wordCount(a.content)<350);
  const stale=published.filter(a=>a.updated_at && Date.now()-new Date(a.updated_at).getTime()>1000*60*60*24*365);
  const internal=published.filter(a=>{const slug=String(a.slug||'').toLocaleLowerCase('tr-TR');return slug && !published.some(b=>b.id!==a.id && text(b.content).toLocaleLowerCase('tr-TR').includes(slug));});
  const vitals=liveWebVitals();
  const score=Math.round(checks.filter(x=>x[1]).length/checks.length*100);
  return {base,checks,score,missingSeo,thin,stale,internal,vitals};
}

function extractJson(textValue){let t=text(textValue).trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)t=t.slice(a,b+1);const c=t.indexOf('['),d=t.lastIndexOf(']');if(!(a>=0&&b>a)&&c>=0&&d>c)t=t.slice(c,d+1);return JSON.parse(t);}
async function aiCall(prompt,systemPrompt){const {data,error}=await sb.functions.invoke(CONFIG.AI_FUNCTION,{body:{prompt,systemPrompt}});if(error)throw error;const result=typeof data==='string'?data:(data?.text||data?.result||'');if(!result)throw new Error(data?.error||'AI boş cevap döndürdü.');return result;}
async function runBulkAI(){const type=$('#bulkType')?.value||'articles',count=Math.max(1,Math.min(10,Number($('#bulkCount')?.value||5))),topic=$('#bulkTopic')?.value.trim()||'',instruction=$('#bulkInstruction')?.value.trim()||'';if(topic.length<3)throw new Error('Önce bir ana konu yaz.');const progress=$('#bulkProgress'),box=$('#bulkResult');if(box)box.innerHTML='<div class="notice">Gemini toplu içerik üretiyor…</div>';if(progress)progress.style.width='15%';const specs={articles:{label:'makale',shape:'title, slug, excerpt, content, category, tags, seo_title, seo_description',rule:'Her kayıt kapsamlı fakat gerçek kaynak uydurmayan bir hukuk bilgi makalesi olsun. status alanı üretme.'},glossary:{label:'sözlük terimi',shape:'term, definition, category, related_terms',rule:'Tanımlar sade, doğru ve bilgilendirici olsun.'},faq:{label:'SSS',shape:'question, answer, category',rule:'Gerçek kullanıcı arama niyetlerini karşılayan sorular üret.'},caselaw:{label:'kaynaklı içtihat analizi',shape:'court, chamber, decision_number, decision_date, title, summary, content, category, tags',rule:'GERÇEK BİR KARAR KAYNAĞI SAĞLANMADIYSA mahkeme, daire, karar numarası veya tarih uydurma. Kaynak yoksa kayıtları oluşturma ve açıkça kaynak metni gerektiğini bildir.'}}[type];const system=`Sen Ahmet Ali Ünal'ın Türkçe hukuk bilgi portalı için yapılandırılmış içerik üretim asistanısın. ${specs.rule} Gerçek mevzuat, karar, madde numarası veya kaynak uydurma. Hukuki danışmanlık verme. Yalnızca geçerli JSON döndür. JSON biçimi: {"items":[{${specs.shape}}]}. Tam olarak ${count} kayıt üret.`;const raw=await aiCall(`Ana konu: ${topic}\nEk talimat: ${instruction}\nİstenen içerik türü: ${specs.label}.`,system);if(progress)progress.style.width='55%';const parsed=extractJson(raw);const items=Array.isArray(parsed)?parsed:parsed.items;if(!Array.isArray(items)||!items.length)throw new Error('AI beklenen JSON listesini döndürmedi.');const selected=items.slice(0,count);if(type==='caselaw'&&selected.some(x=>!x.court||!x.decision_number||!x.decision_date)){throw new Error('İçtihat için gerçek karar kaynağı ve temel karar bilgileri gerekli. AI uydurma karar kaydetmedi.');}const now=new Date().toISOString();let rows=[];if(type==='articles')rows=selected.map(x=>({title:text(x.title).trim(),slug:slugify(x.slug||x.title),excerpt:text(x.excerpt).trim()||null,content:text(x.content).trim(),category:text(x.category).trim()||null,tags:arrayValue(x.tags),status:'draft',featured:false,seo_title:text(x.seo_title).trim()||null,seo_description:text(x.seo_description).trim()||null,updated_at:now}));if(type==='glossary')rows=selected.map(x=>({term:text(x.term).trim(),definition:text(x.definition).trim(),category:text(x.category).trim()||null,related_terms:arrayValue(x.related_terms),status:'published',updated_at:now}));if(type==='faq')rows=selected.map((x,i)=>({question:text(x.question).trim(),answer:text(x.answer).trim(),category:text(x.category).trim()||null,status:'published',sort_order:999+i,updated_at:now}));if(type==='caselaw')rows=selected.map(x=>({court:text(x.court).trim(),chamber:text(x.chamber).trim()||null,decision_number:text(x.decision_number).trim(),decision_date:text(x.decision_date).trim()||null,title:text(x.title).trim()||null,summary:text(x.summary).trim()||null,content:text(x.content).trim(),category:text(x.category).trim()||null,tags:arrayValue(x.tags),status:'draft',featured:false,updated_at:now}));if(rows.some(x=>!Object.values(x).some(v=>typeof v==='string'?v.trim():v)))throw new Error('Üretilen içerik boş.');const table=CONFIG.TABLES[type];const {error}=await sb.from(table).insert(rows);if(error)throw error;if(progress)progress.style.width='100%';await loadAdminContent();if(box)box.innerHTML=`<div class="notice ok">✓ ${rows.length} kayıt oluşturuldu. ${type==='articles'||type==='caselaw'?'Makaleler/içtihatlar taslak olarak kaydedildi.':'İçerikler yayın durumunda kaydedildi.'}</div>`;notify(`${rows.length} içerik oluşturuldu.`,'ok');}

async function render(){
  const renderStarted=performance.now();
  applyTheme();
  renderHeader();
  const parts=routeParts();
  const base=parts[0]||'home';
  let html='';
  try{
    if(base==='admin'){
      setMeta({title:'Yönetim',description:'Yönetim paneli',noindex:true});
      if(!STATE.isAdmin){html=adminLogin();}
      else {STATE.ui.adminSection=parts[1]||'dashboard'; if(parts[1] && !adminSections.includes(parts[1]) && !['articles','caselaw','glossary','faq'].includes(parts[1])) STATE.ui.adminSection='dashboard';
        if(['articles','caselaw','glossary','faq'].includes(parts[1]) && parts[2]) html=adminShell(adminEditor(parts[1],parts[2]));
        else if(['articles','caselaw','glossary','faq'].includes(parts[1])) html=adminShell(adminList(parts[1]));
        else html=adminShell({dashboard,operations:operationsCenter,'seo-intelligence':seoIntelligence,'content-lab':contentLab,'security-center':securityCenter,'system-monitor':systemMonitor,'seo-autopilot':seoAutopilot,'authority-hub':authorityHub,'audit-lab':auditLab,'live-test':liveTestAdmin,siteEditor,features:featuresAdmin,home:adminHome,settings:settingsAdmin,navigation:navigationAdmin,design:designAdmin,seo:seoAdmin,telegram:telegramAdmin,visitors:visitorsAdmin,'google-seo':googleSeoAdmin,ai:aiBulkAdmin,backup:backupAdmin,system:systemAdmin,messages:messagesAdmin}[STATE.ui.adminSection]?.() || dashboard());
      }
    } else if(base==='home') html=home();
    else if(base==='makaleler') html=featureEnabled('page_articles')?listPage('articles'):notFound('Bu sayfa şu anda yayında değil.');
    else if(base==='makale') html=featureEnabled('page_articles')?articleDetail(decodeURIComponent(parts[1]||'')):notFound('Bu sayfa şu anda yayında değil.');
    else if(base==='ictihatlar') html=featureEnabled('page_caselaw')?listPage('caselaw'):notFound('Bu sayfa şu anda yayında değil.');
    else if(base==='ictihat') html=featureEnabled('page_caselaw')?caseDetail(decodeURIComponent(parts[1]||'')):notFound('Bu sayfa şu anda yayında değil.');
    else if(base==='sozluk') html=featureEnabled('page_glossary')?(parts[1] ? glossaryDetail(decodeURIComponent(parts[1])) : listPage('glossary')):notFound('Bu sayfa şu anda yayında değil.');
    else if(base==='sss') html=featureEnabled('page_faq')?faqPage():notFound('Bu sayfa şu anda yayında değil.');
    else if(base==='hakkimda') html=featureEnabled('page_about')?aboutPage():notFound('Bu sayfa şu anda yayında değil.');
    else if(base==='iletisim') html=featureEnabled('page_contact')?contactPage():notFound('Bu sayfa şu anda yayında değil.');
    else html=home();
  }catch(error){console.error('Render error',error);html=`<section class="section"><div class="container"><div class="notice error">Sayfa hazırlanırken beklenmeyen bir hata oluştu. Lütfen tekrar deneyin.</div><a class="btn" href="#home">Ana sayfa</a></div></section>`;}
  $('#app').innerHTML=degradedNotice()+html;
  document.querySelectorAll('.privacy-consent').forEach(x=>x.remove());
  document.body.insertAdjacentHTML('beforeend',visitorConsentBanner());
  if(!location.hash.startsWith('#admin')) setTimeout(()=>{maybeLoadGoogleAnalytics();trackVisitor('pageview');},50);
  if(base==='admin') renderHeader();
  window.scrollTo({top:0,behavior:'instant'});
  STATE.ui.renderMs=Number((performance.now()-renderStarted).toFixed(1));
  STATE.ui.lastSync=new Date().toISOString();
}

async function saveEditor(form){

function buildSitemapXml(){
  const base=siteBaseUrl().replace(/\/$/,''); const now=new Date().toISOString(); const urls=[];
  const add=(path,lastmod=now)=>urls.push({loc:base+(path==='/'?'':('/'+path.replace(/^\//,''))),lastmod});
  add('/'); ['makaleler','ictihatlar','sozluk','sss','hakkimda','iletisim'].forEach(add);
  STATE.articles.filter(isPublished).forEach(a=>{if(a.slug)add('makale/'+encodeURIComponent(a.slug),a.updated_at||a.published_at||now);});
  STATE.caselaw.filter(isPublished).forEach(c=>add('ictihat/'+encodeURIComponent(c.id),c.updated_at||c.decision_date||now));
  STATE.glossary.filter(isPublished).forEach(g=>add('sozluk/'+encodeURIComponent(g.id),g.updated_at||g.created_at||now));
  const seen=new Set(); const clean=urls.filter(u=>{if(seen.has(u.loc))return false;seen.add(u.loc);return true;});
  return `<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">${clean.map(u=>`<url><loc>${esc(u.loc)}</loc><lastmod>${new Date(u.lastmod||now).toISOString()}</lastmod></url>`).join('')}</urlset>`;
}

  function recentModal(){const all=read(RECENT_KEY,[]);const html=all.length?all.map(x=>`<div class="recent-chip"><div class="eyebrow">${esc(x.type)}</div><b>${esc(x.title)}</b><p class="small muted">${esc(text(x.excerpt||'').slice(0,120))}</p><a class="btn small" href="${esc(x.url)}">Aç</a></div>`).join(''):'<div class="empty">Henüz okuma geçmişi yok.</div>';openModal(`<div class="modal-head"><div><div class="eyebrow">Geçmiş</div><h3>Son baktıklarım</h3></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="recent-strip">${html}</div>`)}
  function network(){const cur=typeof currentUxItem==='function'?currentUxItem():null;if(!cur){notify('İçerik ağı için bir içerik açın.','info');return}const base=cur.title.toLocaleLowerCase('tr-TR').split(/\s+/).filter(x=>x.length>4);const pool=[...(STATE.articles||[]).map(x=>({type:'Makale',title:x.title,url:safeHref('#makale/'+encodeURIComponent(x.slug),'/makaleler'),text:(x.title+' '+x.excerpt+' '+x.category+' '+arrayValue(x.tags).join(' ')).toLocaleLowerCase('tr-TR')})),...(STATE.caselaw||[]).map(x=>({type:'İçtihat',title:x.title||x.decision_number||'İçtihat',url:safeHref('#ictihat/'+encodeURIComponent(x.id),'/ictihatlar'),text:(x.title+' '+x.summary+' '+x.category+' '+arrayValue(x.tags).join(' ')).toLocaleLowerCase('tr-TR')})),...(STATE.glossary||[]).map(x=>({type:'Sözlük',title:x.term,url:safeHref('#sozluk/'+encodeURIComponent(x.id),'/sozluk'),text:(x.term+' '+x.definition+' '+x.category).toLocaleLowerCase('tr-TR')}))];const ranked=pool.filter(x=>x.title!==cur.title).map(x=>({...x,score:base.reduce((n,w)=>n+(x.text.includes(w)?1:0),0)})).sort((a,b)=>b.score-a.score).filter(x=>x.score>0).slice(0,8);openModal(`<div class="modal-head"><div><div class="eyebrow">İçerik ağı</div><h3>Bu konuya yakın içerikler</h3></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="content-network">${ranked.length?ranked.map(x=>`<div class="network-item"><div><span class="eyebrow">${esc(x.type)}</span><b>${esc(x.title)}</b></div><a class="btn small" href="${esc(x.url)}">Aç</a></div>`).join(''):'<div class="empty">Yakın içerik bulunamadı.</div>'}</div>`)}
  function compare(){const all=typeof uxSaved==='function'?uxSaved():[];if(all.length<2){notify('Karşılaştırmak için en az iki içerik kaydedin.','info');return}const chosen=all.slice(0,2);const panes=chosen.map(x=>`<article class="compare-pane"><div class="eyebrow">${esc(x.type)}</div><h3>${esc(x.title)}</h3><p>${esc(x.excerpt||'')}</p><a class="btn small" href="${esc(x.url)}">İçeriği aç</a></article>`).join('');openModal(`<div class="modal-head"><div><div class="eyebrow">Araştırma</div><h3>İki içerik karşılaştırması</h3></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="compare-grid">${panes}</div><div class="notice" style="margin-top:14px">Karşılaştırma, kaydedilmiş ilk iki içeriği yan yana gösterir. Daha gelişmiş karşılaştırma için farklı içerikleri listenin başına alın.</div>`)}
  async function installApp(){if(window.__pwaPrompt){window.__pwaPrompt.prompt();await window.__pwaPrompt.userChoice;window.__pwaPrompt=null;return}notify('Tarayıcı bu sayfayı yüklenebilir uygulama olarak sunmaya hazır değil. Menüden “Ana ekrana ekle” seçeneğini kullanabilirsiniz.','info')}
  function uxDockPlus(){const dock=document.querySelector('#experienceDock');if(!dock||!featureEnabled('command_dock'))return;if(dock.querySelector('[data-action="accessibility"]'))return;const f=featureMap();const b=(key,a,aria,title,txt)=>f[key]?`<button data-action="${a}" aria-label="${aria}" title="${title}">${txt}</button>`:'';dock.insertAdjacentHTML('beforeend',b('accessibility','accessibility','Erişilebilirlik','Erişilebilirlik','Aa')+b('notes','notes','Notlar','Notlar','✎')+b('content_network','network','İçerik ağı','İçerik ağı','⌘')+b('recent','recent','Son baktıklarım','Son baktıklarım','↺')+b('compare','compare','Karşılaştır','Karşılaştır','⇄')+b('collections','collections','Koleksiyonlar','Koleksiyonlar','▦')+b('research_export','export-research','Araştırma paketini dışa aktar','Araştırma paketini dışa aktar','⇩')+b('pwa','install-app','Uygulamayı yükle','Uygulamayı yükle','＋'))}
  function patchEnsure(){try{uxDockPlus();applyA11y()}catch{}}
  const oldEnsure=window.ensureExperienceUI; // lexical function is not necessarily global; fallback is observer-based below
  document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;try{if(a==='accessibility')accessibilityPanel();else if(a==='a11y-toggle'){const x=a11y();x[el.dataset.key]=!x[el.dataset.key];write(A11Y_KEY,x);applyA11y();accessibilityPanel()}else if(a==='notes')notes();else if(a==='network')network();else if(a==='recent')recentModal();else if(a==='compare')compare();else if(a==='delete-note')deleteNote(el.dataset.index);else if(a==='install-app')await installApp()}catch(err){notify(err.message||'İşlem başarısız.','error')}});
  document.addEventListener('submit',e=>{if(e.target.id==='uxNoteForm'){e.preventDefault();const t=e.target.note.value;if(t.trim())saveNote(t)}});
  document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key.toLowerCase()==='a')accessibilityPanel();if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.metaKey)toggleReadingMode();if(e.key==='?')shortcuts()});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__pwaPrompt=e;document.querySelectorAll('.install-chip').forEach(x=>x.classList.add('ready'))});
  window.addEventListener('load',()=>{patchEnsure();setTimeout(patchEnsure,500)});
  new MutationObserver(()=>setTimeout(patchEnsure,20)).observe(document.body,{childList:true,subtree:true});
  window.__finalUX={applyA11y,accessibilityPanel,notes,network,compare,recentModal};
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();

/* FINAL PRODUCT LAYER 2026-09 */
(function(){
  const STYLE=`
  .research-export-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .voice-search-btn.is-listening{animation:voicePulse 1s infinite}
  @keyframes voicePulse{50%{transform:scale(1.06);box-shadow:0 0 0 8px rgba(212,175,55,.12)}}
  .research-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.research-stat{padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035)}.research-stat b{display:block;font-size:22px}.research-stat span{font-size:12px;color:var(--muted)}
  .preferred-source-box{padding:16px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,rgba(212,175,55,.08),rgba(255,255,255,.02))}
  @media(max-width:760px){.research-export-grid,.research-stats{grid-template-columns:1fr}}
  `;
  document.head.insertAdjacentHTML('beforeend',`<style data-final-product-layer>${STYLE}</style>`);
  const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};
  const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};
  const COLLECTIONS_KEY='portal-collections-v1';
  const SEARCH_HISTORY_KEY='portal-search-history-v1';
  function current(){return typeof currentUxItem==='function'?currentUxItem():null}
  function collections(){return read(COLLECTIONS_KEY,[])}
  function saveCollections(v){write(COLLECTIONS_KEY,v.slice(0,20))}
  function addCollection(){const name=prompt('Koleksiyon adı?','Araştırma');if(!name?.trim())return;const all=collections();if(all.some(x=>x.name.toLocaleLowerCase('tr-TR')===name.trim().toLocaleLowerCase('tr-TR'))){notify('Bu koleksiyon zaten var.','info');return}all.push({id:crypto.randomUUID?.()||String(Date.now()),name:name.trim(),items:[],createdAt:new Date().toISOString()});saveCollections(all);collectionsModal()}
  function collectionsModal(){const all=collections();const saved=typeof uxSaved==='function'?uxSaved():[];const html=all.length?all.map(c=>{const count=c.items.length;return `<div class="network-item"><div><span class="eyebrow">Koleksiyon</span><b>${esc(c.name)}</b><div class="small muted">${count} içerik</div></div><button class="btn small" data-action="open-collection" data-id="${esc(c.id)}">Aç</button></div>`}).join(''):'<div class="empty">Henüz koleksiyon oluşturmadın.</div>';openModal(`<div class="modal-head"><div><div class="eyebrow">Araştırma sistemi</div><h3>Koleksiyonlar</h3></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="research-stats"><div class="research-stat"><b>${saved.length}</b><span>Kaydedilen</span></div><div class="research-stat"><b>${all.length}</b><span>Koleksiyon</span></div><div class="research-stat"><b>${all.reduce((n,x)=>n+x.items.length,0)}</b><span>Koleksiyon öğesi</span></div></div><button class="btn primary" data-action="add-collection">＋ Yeni koleksiyon</button><div class="content-network" style="margin-top:14px">${html}</div>`)}
  function openCollection(id){const c=collections().find(x=>x.id===id);if(!c)return;const saved=typeof uxSaved==='function'?uxSaved():[];const items=c.items.map(k=>saved.find(x=>x.type+':'+x.id===k)).filter(Boolean);openModal(`<div class="modal-head"><div><div class="eyebrow">Koleksiyon</div><h3>${esc(c.name)}</h3></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="content-network">${items.length?items.map(x=>`<div class="network-item"><div><span class="eyebrow">${esc(x.type)}</span><b>${esc(x.title)}</b></div><a class="btn small" href="${esc(x.url)}">Aç</a></div>`).join(''):'<div class="empty">Bu koleksiyonda henüz içerik yok.</div>'}</div><div class="notice" style="margin-top:14px">Bir içerikteki “Koleksiyona ekle” komutunu kullanarak bu listeyi büyütebilirsin.</div>`)}
  function addCurrentToCollection(){const cur=current();if(!cur){notify('Koleksiyona eklemek için bir içerik açın.','info');return}const all=collections();if(!all.length){addCollection();return}const options=all.map((c,i)=>`${i+1}. ${c.name} (${c.items.length})`).join('\n');const raw=prompt(`Koleksiyon seçin:\n${options}\n\nNumara:`,'1');const idx=Number(raw)-1;if(!Number.isInteger(idx)||!all[idx])return;const key=cur.type+':'+cur.id;all[idx].items=all[idx].items||[];if(!all[idx].items.includes(key))all[idx].items.unshift(key);saveCollections(all);notify(`“${all[idx].name}” koleksiyonuna eklendi.`,'ok')}
  function exportResearch(){const saved=typeof uxSaved==='function'?uxSaved():[];const notes=read('portal-notes-v1',{});const collectionsData=collections();const payload={exported_at:new Date().toISOString(),site:typeof siteName==='function'?siteName():'Hukuk Portalı',saved,notes,collections:collectionsData,recent:read(typeof UX_RECENT_KEY!=='undefined'?UX_RECENT_KEY:'portal-recent-v1',[])};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`hukuk-arastirma-paketi-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('Araştırma paketi dışa aktarıldı.','ok')}
  function addSearchHistory(q){const v=q.trim();if(!v)return;const h=read(SEARCH_HISTORY_KEY,[]).filter(x=>x!==v);h.unshift(v);write(SEARCH_HISTORY_KEY,h.slice(0,12))}
  function searchHistoryModal(){const h=read(SEARCH_HISTORY_KEY,[]);openModal(`<div class="modal-head"><div><div class="eyebrow">Arama hafızası</div><h3>Son aramalar</h3></div><button class="icon-btn" data-action="close-modal">×</button></div>${h.length?`<div class="content-network">${h.map(q=>`<button class="btn" style="justify-content:flex-start" data-action="reuse-search" data-query="${esc(q)}">⌕ ${esc(q)}</button>`).join('')}</div><button class="btn" style="margin-top:12px" data-action="clear-search-history">Temizle</button>`:'<div class="empty">Henüz arama geçmişi yok.</div>'}`)}
  function voiceSearch(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){notify('Bu tarayıcı sesli aramayı desteklemiyor.','info');return}const input=document.querySelector('[data-global-search]');const r=new SR();r.lang='tr-TR';r.interimResults=false;r.maxAlternatives=1;document.querySelectorAll('.voice-search-btn').forEach(b=>b.classList.add('is-listening'));r.onresult=e=>{const q=e.results?.[0]?.[0]?.transcript||'';addSearchHistory(q);if(input){input.value=q;input.dispatchEvent(new Event('input',{bubbles:true}))}else globalSearch(q)};r.onerror=()=>notify('Sesli arama tamamlanamadı.','error');r.onend=()=>document.querySelectorAll('.voice-search-btn').forEach(b=>b.classList.remove('is-listening'));r.start()}
  function preferredSource(){
    openModal(`<div class="modal-head"><div><div class="eyebrow">Google Search</div><h3>Tercih edilen kaynak</h3></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="preferred-source-box"><p>Bu siteyi Google Arama'da tercih edilen kaynak olarak ekleyebilirsin. Google bu özelliği okuyucuların kaynak tercihlerini yönetmesine yardımcı olmak için sunuyor.</p><div id="preferredSourceButton" style="margin-top:14px"></div></div><p class="small muted" style="margin-top:12px">Özellik Google tarafından sunulur; kullanılabilirlik hesabına ve bölgeye göre değişebilir.</p>`);
    if(!document.querySelector('script[data-google-preferred-source]')){const s=document.createElement('script');s.async=true;s.src='https://news.google.com/swg/js/v1/publisher.js';s.dataset.googlePreferredSource='1';document.head.appendChild(s)}
    const mount=()=>{const box=document.querySelector('#preferredSourceButton');if(box&&!box.hasAttribute('google-add-preferred-source-btn')){box.setAttribute('google-add-preferred-source-btn','');box.setAttribute('data-theme','dark');box.setAttribute('data-lang','tr')}};mount();setTimeout(mount,300);setTimeout(mount,1000)
  }
  document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;try{switch(el.dataset.action){case'add-collection':addCollection();break;case'open-collection':openCollection(el.dataset.id);break;case'add-current-collection':addCurrentToCollection();break;case'collections':if(featureEnabled('collections'))collectionsModal();break;case'export-research':if(featureEnabled('research_export'))exportResearch();break;case'voice-search':if(featureEnabled('voice_search'))voiceSearch();break;case'search-history':if(featureEnabled('search_history'))searchHistoryModal();break;case'reuse-search':globalSearch(el.dataset.query||'');break;case'clear-search-history':localStorage.removeItem(SEARCH_HISTORY_KEY);searchHistoryModal();break;case'preferred-source':if(featureEnabled('preferred_source'))preferredSource();break}}catch(err){notify(err.message||'İşlem başarısız.','error')}});
  document.addEventListener('input',e=>{if(e.target.matches('[data-global-search]')&&e.target.value.trim().length>2)addSearchHistory(e.target.value)});
  window.__finalProductLayer={collectionsModal,addCurrentToCollection,exportResearch,voiceSearch,searchHistoryModal,preferredSource};
  const dock=document.querySelector('#experienceDock');if(dock&&!dock.querySelector('[data-action="collections"]')){dock.insertAdjacentHTML('beforeend','<button data-action="collections" aria-label="Koleksiyonlar" title="Koleksiyonlar">▦</button><button data-action="export-research" aria-label="Araştırma paketini dışa aktar" title="Araştırma paketini dışa aktar">⇩</button>')}
  if(featureEnabled('preferred_source')&&!document.querySelector('[data-preferred-source-promo]')&&!location.hash.startsWith('#admin')){const footer=document.querySelector('.footer .container');if(footer){const d=document.createElement('div');d.dataset.preferredSourcePromo='1';d.className='preferred-source-box';d.style.marginTop='16px';d.innerHTML='<strong>Bu kaynağı takip etmek ister misiniz?</strong><p class="small muted">Google Arama’da bu siteyi tercih edilen kaynak olarak ekleyebilirsiniz.</p><button class="btn" data-action="preferred-source">Google tercih edilen kaynak</button>';footer.appendChild(d)}}
  window.addEventListener('beforeunload',()=>{});
})();

</script>
